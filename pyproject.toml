[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phishing-url-analyzer"
version = "0.2.0"
description = "SOC triage tool for phishing URL detection with MITRE ATT&CK mapping"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["security", "phishing", "soc", "threat-intelligence", "mitre-attack"]
classifiers = ["Development Status :: 3 - Alpha",
               "Intended Audience :: Information Technology",
               "Topic :: Security",
               "Programming Language :: Python :: 3",
               "Programming Language :: Python :: 3.9",
               "Programming Language :: Python :: 3.11",
               "Programming Language :: Python :: 3.12",
               "License :: OSI Approved :: MIT License"]
dependencies = ["python-whois>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=8",
       "pytest-cov>=4.1"]
lint = ["flake8>=7.0",
        "flake8-bugbear>=24.0"]

[project.scripts]
phishing-analyze = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "src/main.py"]

[tool.coverage.report]
show_missing = true
fail_under = 60

[tool.flake8]
max-line-length = 100
extend-ignore = ["E127", "E128", "E203", "E501", "W292", "W503"]
exclude = [".git", "__pycache__", "venv", ".venv", "build", "dist", ".eggs"]
per-file-ignores = ["tests/*:S101"]