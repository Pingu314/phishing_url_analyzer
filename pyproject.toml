[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phishing-url-analyzer"
version = "1.2.0"
description = "Phishing URL detection and triage: risk scoring 0-100, threat-intel enrichment, MITRE ATT&CK mapping"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["security", "phishing", "soc", "threat-intelligence", "mitre-attack"]
classifiers = ["Development Status :: 5 - Production/Stable",
               "Intended Audience :: Information Technology",
               "Topic :: Security",
               "Programming Language :: Python :: 3",
               "Programming Language :: Python :: 3.9",
               "Programming Language :: Python :: 3.10",
               "Programming Language :: Python :: 3.11",
               "Programming Language :: Python :: 3.12",
               "Programming Language :: Python :: 3.13",
               "License :: OSI Approved :: MIT License"]
dependencies = ["python-whois>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=8",
       "pytest-cov>=4.1"]
lint = ["flake8>=7.0",
        "flake8-bugbear>=24.0"]

[project.scripts]
phishing-analyze = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short --cov=src --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
source = ["src", "config"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 95