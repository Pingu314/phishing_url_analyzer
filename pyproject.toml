[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "phishing-url-analyzer"
version = "0.2.0"
description = "Rule-based phishing URL analyzer with MITRE ATT&CK mapping"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["python-whois>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
phishing-analyze = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]