[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phishing-url-analyzer"
version = "0.2.0"
description = "Rule-based phishing URL analyzer with MITRE ATT&CK mapping"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["python-whois>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=8",
       "pytest-cov>=4.1"]
lint = ["flake8>=7.0",
        "flake8-bugbear>=24.0"]

[project.scripts]
phishing-analyze = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", "build", "dist", ".eggs"]